[project]
name = "steam-cm-api"
version = "0.3.2"
description = "Fetch a Steam account's inventory over a real CM (Connection Manager) session, from a desktop/mobile refresh token"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["steam", "steamworks", "inventory", "trading", "cs2", "cm", "connection-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "cryptography>=42",
    "protobuf>=5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
codegen = ["grpcio-tools>=1.60"]
# Only needed for `steam-cm-api extract-token` (reads local.vdf's DPAPI-encrypted
# ConnectCache) - not needed for the CM client itself.
local-client = ["pywin32>=306; sys_platform == 'win32'", "vdf>=3.4"]

[project.scripts]
steam-cm-api = "steam_api.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# steam_api/ lives directly at the repo root (no src/ layout). Distribution
# name (steam-cm-api) differs from the import name, so module-name is explicit.
[tool.uv.build-backend]
module-root = ""
module-name = "steam_api"

[tool.ruff]
include = ["*.py"]
line-length = 100
# examples/ scripts are meant to hold a real refresh token inline - excluded
# so a long token literal doesn't fail lint.
extend-exclude = ["steam_api/pb2", "examples"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "ANN"]

[tool.mypy]
exclude = ["steam_api/pb2"]
strict = true

[[tool.mypy.overrides]]
module = [
    "steammessages_auth.*",
    "steammessages_econ.*",
    "steammessages_base_pb2",
    "steammessages_clientserver_login_pb2",
    "vdf",
    "win32crypt",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
